services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${FINANCE_SQL_SA_PASSWORD:?Set FINANCE_SQL_SA_PASSWORD in .env}
    ports:
      - "${FINANCE_SQL_PORT:-1433}:1433"
    volumes:
      - finance-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${FINANCE_SMTP_PORT:-1025}:1025"
      - "${FINANCE_MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: src/Finance.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FinanceDb: "Server=sqlserver,1433;Database=Finance;User Id=sa;Password=${FINANCE_SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: Finance.Api
      Jwt__Audience: Finance.Frontend
      Jwt__Key: ${FINANCE_JWT_KEY:?Set FINANCE_JWT_KEY in .env}
      Mailpit__Host: mailpit
      Mailpit__Port: 1025
      Mailpit__FrontendUrl: ${FINANCE_FRONTEND_URL:-http://localhost:5173}
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    ports:
      - "${FINANCE_API_PORT:-5180}:8080"

  migrator:
    build:
      context: .
      dockerfile: src/Finance.Api/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__FinanceDb: "Server=sqlserver,1433;Database=Finance;User Id=sa;Password=${FINANCE_SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: Finance.Api
      Jwt__Audience: Finance.Frontend
      Jwt__Key: ${FINANCE_JWT_KEY:?Set FINANCE_JWT_KEY in .env}
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${FINANCE_FRONTEND_PORT:-5173}:80"

volumes:
  finance-sql-data:
