services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finanse-domowe-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - finance-sql-data:/var/opt/mssql
  mailpit:
    image: axllent/mailpit:latest
    container_name: grosik-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  finance-sql-data:
